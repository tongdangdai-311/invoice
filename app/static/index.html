<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoice Management</title>
<style>
  :root { --ink: #1c2024; --muted: #626b75; --line: #dde1e6; --bg: #f5f6f8; --accent: #1f5f8b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 72px 20px; }
  h1 { font-size: 30px; margin: 0 0 6px; }
  .lead { color: var(--muted); margin: 0 0 32px; }
  .card { display: block; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 22px 24px; color: inherit; text-decoration: none; }
  .card:hover { border-color: var(--accent); }
  .card:focus-visible, .portal:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card h2 { font-size: 19px; margin: 0 0 4px; }
  .card p { margin: 0 0 14px; color: var(--muted); }
  .open { color: var(--accent); font-weight: 600; }
  .portal { display: inline-block; margin-top: 14px; color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Invoice Management</h1>
  <p class="lead">Choose a supplier to view its invoices.</p>
  <a class="card" href="/fw-webb">
    <h2>F.W. Webb</h2>
    <p>Download invoices from the portal and review orders, items, jobs and memos.</p>
    <span class="open">Open invoices &rarr;</span>
  </a>
  <a class="portal" href="https://www.fwwebb.com/wobf/payyourbill" target="_blank" rel="noopener">Go to the F.W. Webb website</a>
</main>
</body>
</html>
