<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Import Log</title>
<style>
  :root { --ink: #1c2024; --muted: #626b75; --line: #dde1e6; --bg: #f5f6f8; --accent: #1f5f8b; --bad: #a32020; --good: #1d6b3a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; }
  .back { display: inline-block; margin-bottom: 12px; color: var(--accent); }
  header { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  h1 { font-size: 22px; margin: 0; }
  .lead { color: var(--muted); margin: 0 0 18px; }
  .who { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .who input { font: inherit; font-weight: 400; color: var(--ink); padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; width: 180px; }
  #message { margin: 0 0 12px; color: var(--bad); }
  #message.ok { color: var(--good); }
  #message:empty { display: none; }
  .table-wrap { background: #fff; border: 1px solid var(--line); border-radius: 6px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
  thead th { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  tbody tr:last-child td { border-bottom: none; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .when { white-space: nowrap; }
  .muted { color: var(--muted); }
  .status { font-size: 13px; }
  .status.undone { color: var(--muted); }
  tr.undone td:not(:last-child) { color: var(--muted); }
  tr.undone .num { text-decoration: line-through; }
  button { font: inherit; font-size: 13px; padding: 4px 12px; border-radius: 6px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); }
  button:disabled { opacity: .6; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .empty { padding: 40px 20px; text-align: center; color: var(--muted); }
  .actions { display: flex; gap: 6px; justify-content: flex-end; white-space: nowrap; }
  button.details { color: var(--accent); }
  button.details:hover { border-color: var(--accent); color: var(--accent); }
  tr.detail-row > td { background: #fafbfc; padding: 6px 12px 14px 28px; }
  .detail { width: 100%; border-collapse: collapse; font-size: 14px; }
  .detail th { font-size: 11px; padding: 6px 10px; }
  .detail td { padding: 6px 10px; border-bottom: 1px solid #eceff2; }
  .detail tr:last-child td { border-bottom: none; }
  .detail .paid { color: var(--good); font-size: 12px; font-weight: 600; margin-left: 6px; }
  .detail-note { margin: 8px 0 0; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <a class="back" href="/fw-webb">&larr; Invoice list</a>
  <header>
    <h1>Import log</h1>
    <label class="who">Your name <input id="name" maxlength="100" autocomplete="name" placeholder="Needed to undo"></label>
  </header>
  <p class="lead">Every time invoices are added, from a scrape or a CSV import. Undo removes exactly the invoices that import added.</p>
  <p id="message" role="alert"></p>
  <div class="table-wrap">
    <table>
      <thead><tr><th>When</th><th>Added by</th><th>From</th><th class="num">Invoices</th><th class="num">Total</th><th>Status</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty" hidden>Nothing has been added yet. Invoices you add from the draft list, or import from a CSV, show up here.</div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const openBatches = new Set();     // Log entries whose Details are showing.
const batchOrders = new Map();     // batch id -> its invoices, fetched once.
const money = (cents) => (cents / 100).toLocaleString("en-US", { style: "currency", currency: "USD" });
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;

function el(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
}
function showMessage(text, ok = false) {
  $("message").textContent = text || "";
  $("message").classList.toggle("ok", ok);
}
// The server stores UTC without a zone marker; mark it as UTC so it shows in local time.
function when(value) {
  const date = value ? new Date(/[zZ]|[+-]\d\d:\d\d$/.test(value) ? value : value + "Z") : null;
  return date && !isNaN(date) ? date.toLocaleString("en-US", { dateStyle: "medium", timeStyle: "short" }) : "";
}

// Calendar dates (no time): read as local dates, not UTC.
function day(value) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(value || "");
  return m ? new Date(+m[1], m[2] - 1, +m[3]).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) : "—";
}

function detailTable(batch, orders) {
  if (batch.undone_at) return el("p", { className: "detail-note", textContent: "These invoices were removed by Undo." });
  if (!orders.length) return el("p", { className: "detail-note", textContent: "None of these invoices are in the list any more." });
  // Invoice ID only. CSV imports have none, so they show the CSV's number (usually the same).
  const head = el("tr", {}, ...["Invoice ID", "Job name", "Price", "Date purchased", "Due date"].map((h) =>
    el("th", { textContent: h, className: h === "Price" ? "num" : "" })));
  const rows = orders.map((o) => el("tr", {},
    el("td", { textContent: o.invoice_id || o.order_id }),
    el("td", { textContent: o.job_name || "—" }),
    el("td", { className: "num", textContent: money(o.total_cents) }),
    el("td", { className: "when", textContent: day(o.purchased_on) }),
    el("td", { className: "when" }, day(o.due_on), ...(o.paid_on ? [el("span", { className: "paid", textContent: "Paid" })] : []))));
  const gone = batch.invoice_count - orders.length;
  return el("div", {},
    el("table", { className: "detail" }, el("thead", {}, head), el("tbody", {}, ...rows)),
    ...(gone > 0 ? [el("p", { className: "detail-note", textContent: `${plural(gone, "other invoice")} from this import ${gone === 1 ? "is" : "are"} no longer in the list.` })] : []));
}

async function toggleDetails(batch) {
  if (openBatches.has(batch.id)) {
    openBatches.delete(batch.id);
  } else {
    openBatches.add(batch.id);
    if (!batch.undone_at && !batchOrders.has(batch.id)) {
      try {
        batchOrders.set(batch.id, await api(`/api/import-log/${batch.id}/orders`));
      } catch (error) {
        openBatches.delete(batch.id);
        showMessage(`Could not load the invoices: ${error.message}`);
      }
    }
  }
  renderRows();
}

function myName() { try { return localStorage.getItem("myName") || ""; } catch { return ""; } }
function rememberName(name) { try { localStorage.setItem("myName", name); } catch {} }

async function api(path, options) {
  const response = await fetch(path, options);
  if (response.status === 401) { location.href = "/login"; throw new Error("Please sign in"); }
  const body = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(body.detail || `Request failed (${response.status})`);
  return body;
}

function status(batch) {
  if (batch.undone_at) return `Undone${batch.undone_by ? ` by ${batch.undone_by}` : ""}, ${when(batch.undone_at)}`;
  const parts = [];
  if (batch.still_there < batch.invoice_count) parts.push(`${batch.still_there} of ${batch.invoice_count} still in the list`);
  if (batch.paid_now) parts.push(`${batch.paid_now} paid`);
  return parts.join(" · ") || "Added";
}

async function undo(batch, button) {
  const name = $("name").value.trim();
  if (!name) {
    showMessage("Enter your name at the top first, so the log shows who undid it.");
    $("name").focus();
    return;
  }
  const paid = !batch.paid_now ? ""
    : batch.paid_now === 1 ? " 1 of them is already marked paid and will be removed too."
    : ` ${batch.paid_now} of them are already marked paid and will be removed too.`;
  if (!confirm(`Undo the import from ${when(batch.created_at)}? This removes ${plural(batch.still_there, "invoice")} it added from your invoice list.${paid}`)) return;
  rememberName(name);
  button.disabled = true;
  try {
    const { removed } = await api(`/api/import-log/${batch.id}/undo`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name }),
    });
    showMessage(`Undone: removed ${plural(removed, "invoice")}.`, true);
    batchOrders.delete(batch.id);
    await load();
  } catch (error) {
    button.disabled = false;
    showMessage(`Could not undo: ${error.message}`);
  }
}

let batches = [];

function renderRows() {
  $("rows").replaceChildren(...batches.flatMap((batch) => {
    const isOpen = openBatches.has(batch.id);
    const details = el("button", { className: "details", textContent: isOpen ? "Hide" : "Details", type: "button" });
    details.setAttribute("aria-expanded", isOpen);
    details.setAttribute("aria-label", `${isOpen ? "Hide" : "Show"} the invoices from ${when(batch.created_at)}`);
    details.addEventListener("click", () => toggleDetails(batch));
    const button = el("button", { textContent: "Undo", type: "button" });
    button.setAttribute("aria-label", `Undo the import from ${when(batch.created_at)}`);
    button.addEventListener("click", () => undo(batch, button));
    const done = Boolean(batch.undone_at) || batch.still_there === 0;
    const row = el("tr", { className: batch.undone_at ? "undone" : "" },
      el("td", { className: "when", textContent: when(batch.created_at) }),
      el("td", { textContent: batch.added_by || "—" }),
      el("td", { textContent: batch.source === "csv" ? "CSV import" : "Scrape" }),
      el("td", { className: "num", textContent: batch.invoice_count }),
      el("td", { className: "num", textContent: money(batch.total_cents) }),
      el("td", { className: `status${batch.undone_at ? " undone" : ""}`, textContent: status(batch) }),
      el("td", {}, el("div", { className: "actions" }, details, ...(done ? [] : [button]))));
    if (!isOpen) return [row];
    return [row, el("tr", { className: "detail-row" }, el("td", { colSpan: 7 }, detailTable(batch, batchOrders.get(batch.id) || [])))];
  }));
}

async function load() {
  try {
    batches = await api("/api/import-log");
    renderRows();
    $("empty").hidden = batches.length > 0;
  } catch (error) {
    showMessage(`Could not load the import log: ${error.message}`);
  }
}

$("name").value = myName();
load();
</script>
</body>
</html>
