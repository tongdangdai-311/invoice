<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoice Management</title>
<style>
  :root {
    --ink: #1f1e1b; --muted: #6b665c; --line: #e8e1d3; --bg: #faf7f0; --card: #fffdf8;
    --orange: #d9662f; --orange-dark: #b9521f; --amber: #f2b33d; --glow: rgba(217, 102, 47, .14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink); font: 15px/1.5 system-ui, "Segoe UI", sans-serif;
    background:
      radial-gradient(900px 420px at 85% -10%, rgba(242, 179, 61, .20), transparent 70%),
      radial-gradient(700px 380px at -10% 110%, rgba(217, 102, 47, .12), transparent 70%),
      var(--bg);
  }

  /* Top bar: name on the left, sign out on the right. */
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; max-width: 1040px; margin: 0 auto; padding: 18px 24px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; color: var(--ink); text-decoration: none; }
  .mark { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, var(--amber), var(--orange)); box-shadow: 0 2px 6px var(--glow); }
  .signout {
    font: inherit; font-size: 14px; padding: 7px 16px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--muted);
    transition: color .15s, border-color .15s, background .15s;
  }
  .signout:hover { color: var(--orange-dark); border-color: var(--orange); background: #fff; }

  main { max-width: 760px; margin: 0 auto; padding: 56px 24px 80px; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: clamp(32px, 6vw, 44px); line-height: 1.15; margin: 0 0 10px; letter-spacing: -.01em; }
  h1 em { font-style: italic; color: var(--orange); }
  .lead { color: var(--muted); font-size: 17px; margin: 0 0 40px; }

  /* Supplier card: the whole card is the link. */
  .card {
    position: relative; display: flex; gap: 18px; align-items: flex-start;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px;
    color: inherit; text-decoration: none; overflow: hidden;
    box-shadow: 0 1px 2px rgba(60, 40, 10, .04);
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .card::before { content: ""; position: absolute; inset: 0 0 auto; height: 4px; background: linear-gradient(90deg, var(--amber), var(--orange)); opacity: 0; transition: opacity .18s; }
  .card:hover { transform: translateY(-2px); border-color: #edc9a8; box-shadow: 0 10px 28px var(--glow); }
  .card:hover::before { opacity: 1; }
  .card:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
  .icon {
    flex: none; display: grid; place-items: center; width: 48px; height: 48px; border-radius: 12px;
    background: linear-gradient(135deg, #fde7b8, #f8c9a6); color: var(--orange-dark); font-weight: 700; font-size: 17px;
  }
  .card h2 { font-size: 19px; margin: 2px 0 4px; }
  .card p { margin: 0 0 16px; color: var(--muted); }
  .open {
    display: inline-flex; align-items: center; gap: 6px; padding: 7px 16px; border-radius: 999px;
    background: var(--orange); color: #fff; font-weight: 600; font-size: 14px; transition: background .15s;
  }
  .open .arrow { transition: transform .15s; }
  .card:hover .open { background: var(--orange-dark); }
  .card:hover .open .arrow { transform: translateX(3px); }

  @media (max-width: 480px) {
    header { padding: 14px 16px; }
    main { padding: 32px 16px 56px; }
    .card { flex-direction: column; gap: 14px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <a class="brand" href="/"><span class="mark" aria-hidden="true"></span>Invoice Management</a>
  <form method="post" action="/logout"><button class="signout" type="submit">Sign out</button></form>
</header>
<main>
  <h1>Your supplier <em>invoices</em>, in one place.</h1>
  <p class="lead">Choose a supplier to view its invoices.</p>
  <a class="card" href="/fw-webb">
    <span class="icon" aria-hidden="true">FW</span>
    <div>
      <h2>F.W. Webb</h2>
      <p>Download invoices from the portal and review orders, items, jobs and memos.</p>
      <span class="open">Open invoices <span class="arrow" aria-hidden="true">&rarr;</span></span>
    </div>
  </a>
</main>
</body>
</html>
